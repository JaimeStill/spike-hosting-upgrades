# Project kind: this spike is context (a project-local Claude Code skill, dated reports, GuideLLM
# scenarios, and minimal scripts), checked by `mise run check`. Its goals live in the coordinator's
# roadmap (standards-lab/context/roadmap.toml). `mise run currency` reports every mise tool pinned
# behind its latest, those of mise.toml and of the bench environment (mise.bench.toml). The engine
# pins stay with spike-model-engines, whose suite this spike runs read-only. No gate.
[project]
kind = "context"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. The spike has no
# CI, so the merge doesn't wait on pull-request checks.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
