# Shape cell B: one Gemma 4 model, 4 streams × 32 requests, with thinking on.
# See docs/bench.md#shape-b
# See spike-model-engines/docs/findings/bench-gb10-container.md#method
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    extras:
      body:
        chat_template_kwargs:
          enable_thinking: true
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 32
