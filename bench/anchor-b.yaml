# Anchor cell B: gpt-oss-120b MXFP4 on the llama.cpp router, 4 streams × 32 requests.
# See docs/bench.md#anchor-b
# See spike-model-engines/docs/findings/llama-gb10-container.md
spec:
  backend:
    kind: openai_http
    model: ggml-org/gpt-oss-120b-GGUF:MXFP4
    request_format: /v1/chat/completions
  tokenizer:
    kind: huggingface_auto
    model: openai/gpt-oss-120b
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 32
  outputs:
    - kind: json
      path: .state/anchor/b.json
