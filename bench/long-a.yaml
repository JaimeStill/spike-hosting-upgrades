# Long-prompt cell A: one agent model, 1 stream sending 4 requests back to back, each 8,192
# synthetic prompt tokens and exactly 512 output tokens: the agent floors' 8k prompt
# (spike-model-hosting, evaluation/floors.toml, "[agent]"), for single-stream prefill and its
# TTFT. Engine-neutral, like shape-a.yaml: the model, its tokenizer, and the JSON's path are given
# on the command line, and the target in GUIDELLM__SPEC__BACKEND__TARGET. A section must give
# each slot more than 8,704 tokens and the model's chat template, so framework's 4-slot gpt-oss
# section (8,192 a slot) can't hold it. No request asks for reasoning: the template's default
# stands, and every request generates its full 512 either way. GuideLLM sends
# max_completion_tokens with ignore_eos whenever output_tokens is set. Run from the repository
# root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 1
  data:
    - kind: synthetic_text
      prompt_tokens: 8192
      output_tokens: 512
  constraints:
    - kind: max_requests
      count: 4
