# Long-prompt cell A: one agent model, 1 stream × 4 requests of 8,192 tokens in.
# See docs/bench.md#long-a
# See spike-model-hosting/evaluation/floors.toml
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 1
  data:
    - kind: synthetic_text
      prompt_tokens: 8192
      output_tokens: 512
  constraints:
    - kind: max_requests
      count: 4
