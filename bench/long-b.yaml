# Long-prompt cell B: one agent model, 4 streams × 16 requests of 8,192 tokens in.
# See docs/bench.md#long-b
# See spike-model-hosting/evaluation/floors.toml
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 8192
      output_tokens: 512
  constraints:
    - kind: max_requests
      count: 16
