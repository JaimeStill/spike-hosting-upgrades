# Anchor cell A: gpt-oss-120b MXFP4 on the llama.cpp router, 1 stream × 8 requests.
# See docs/bench.md#anchor-a
# See spike-model-engines/docs/findings/llama-gb10-container.md
spec:
  backend:
    kind: openai_http
    model: ggml-org/gpt-oss-120b-GGUF:MXFP4
    request_format: /v1/chat/completions
  tokenizer:
    kind: huggingface_auto
    model: openai/gpt-oss-120b
  profile:
    kind: concurrent
    streams: 1
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 8
  outputs:
    - kind: json
      path: .state/anchor/a.json
