# Vision cell B: gemma-4-26B-A4B, 4 streams × 32 requests of a 720p JPEG and 200 tokens.
# See docs/bench.md#vision-b
# See spike-model-engines/docs/findings/bench-gb10-container.md#method
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 720p
      format: jpeg
      output_tokens: 64
  constraints:
    - kind: max_requests
      count: 32
