# Concurrency sweep: 1, 4, 16, and 32 streams, 60 s a level, one JSON.
# See docs/bench.md#sweep
# See spike-model-engines/docs/findings/bench-gb10-container.md#method
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: [1, 4, 16, 32]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_duration
      seconds: 60
