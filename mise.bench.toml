# The bench environment: GuideLLM and its runtimes, activated with MISE_ENV=bench.
# See docs/tools.md#the-bench-environment
[tools]
# Held on 3.14: the recorded benchmarks ran on 3.14, so a new interpreter needs a re-run, and
# torchcodec 0.17.0, which GuideLLM 0.8.1's audio extra needs, publishes no Python 3.15 (cp315)
# wheel or sdist yet.
python = "3.14.10"
uv = "0.13.9"
"pipx:guidellm" = { version = "0.8.1", extras = ["vision", "audio"] }
