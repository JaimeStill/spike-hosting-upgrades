# The spike's tools and the tasks that check and report currency.
# See docs/tools.md#the-main-environment
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks.check]
description = "Shellcheck every tracked shell script, resolve every relative Markdown link, and run lint-context and lint-references; reads no network, writes nothing"
run = "scripts/check.sh"

[tasks.currency]
description = "Report every pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
